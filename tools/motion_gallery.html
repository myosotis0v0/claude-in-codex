<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Motion Lab</title>
<style>
:root{color-scheme:dark;--bg:#19191b;--surface:#252528;--line:#444449;--text:#f4f4f5;--muted:#b4b4bb;--accent:#ff9b4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}body.light{color-scheme:light;--bg:#fafafa;--surface:#eeeef0;--line:#d5d5db;--text:#242426;--muted:#63636b;--accent:#bd5108}button,input,a{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{max-width:1200px;margin:auto;padding:20px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}h1{margin:0;font-size:20px;font-weight:600}header span{color:var(--muted);font-size:12px}nav{display:flex;gap:4px;margin-left:auto}button{background:transparent;border:1px solid transparent;border-radius:5px;padding:8px 12px}button[aria-pressed=true]{background:var(--surface);border-color:var(--accent);color:var(--accent)}.icon{width:36px;height:36px;padding:0}.swatch{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:50%}main{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:32px}.viewer{position:sticky;top:16px;align-self:start;min-width:0}.stage{height:390px;display:flex;align-items:center;justify-content:center;background-color:var(--surface);border-radius:8px;overflow:hidden}.stage.checker{background-image:conic-gradient(#ffffff0b 25%,transparent 0 50%,#ffffff0b 0 75%,transparent 0);background-size:24px 24px}canvas{width:336px;height:336px;max-width:100%;object-fit:contain}.toolbar{display:flex;align-items:center;gap:8px;margin-top:12px}.toolbar input{min-width:0;flex:1;accent-color:#f58a32}.caption{display:flex;justify-content:space-between;gap:12px;margin-top:14px}h2{font-size:16px;margin:0}.meta{font-size:12px;color:var(--muted)}.downloads{display:flex;gap:16px;margin-top:16px}a{color:var(--accent);text-decoration:none}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{padding:8px;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}.tile img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.tile span{display:block;margin-top:6px;line-height:1.4;overflow-wrap:anywhere}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.parts{grid-column:1/-1;display:none}.parts img{display:block;max-width:100%;height:auto;margin:auto}.parts.active{display:block}footer{max-width:1200px;margin:0 auto;padding:0 24px 24px;color:var(--muted);font-size:12px}@media(max-width:850px){main{grid-template-columns:1fr}.viewer{position:static}.stage{height:360px}.catalog{grid-template-columns:repeat(3,minmax(0,1fr))}header{flex-wrap:wrap}nav{margin-left:0}}@media(max-width:420px){header,main{padding:16px}.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{height:320px}canvas{width:300px;height:300px}header span{display:none}}
select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:5px 8px}input[type=range]{appearance:none;height:4px;background:var(--line);border-radius:2px}input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border:2px solid var(--accent);background:var(--text);border-radius:50%}input[type=range]::-moz-range-thumb{width:10px;height:10px;border:2px solid var(--accent);background:var(--text);border-radius:50%}
</style>
<header><h1>Claude / Motion Lab</h1><span>14 动态 · 30 FPS · 分层素材</span><nav><button id="motionTab" aria-pressed="true">动态</button><button id="partsTab" aria-pressed="false">部件</button><button id="rigTab" aria-pressed="false">骨骼</button></nav></header>
<main><section class="viewer" id="viewer"><div class="stage checker" id="stage"><canvas id="canvas" width="336" height="336" aria-label="动态预览"></canvas></div><div class="toolbar"><button class="icon" id="previous" title="上一个" aria-label="上一个">&#9664;</button><button class="icon" id="play" title="暂停" aria-label="暂停">&#10074;&#10074;</button><button class="icon" id="next" title="下一个" aria-label="下一个">&#9654;</button><input id="timeline" type="range" min="0" max="179" value="0" aria-label="动画帧"><span class="meta" id="frame">001/180</span></div><div class="caption"><h2 id="name"></h2><span class="meta">6.00s / 30 FPS</span></div><div class="toolbar"><button class="swatch" style="background:#202022" id="dark" title="深色底" aria-label="深色底"></button><button class="swatch" style="background:#fafafa" id="light" title="浅色底" aria-label="浅色底"></button><button class="icon" id="checker" title="透明棋盘" aria-label="透明棋盘">&#9638;</button><select id="speed" aria-label="播放速度"><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select></div><div class="downloads"><a id="gif" download>GIF</a><a id="webp" download>透明 WebP</a><a id="poster" download>关键帧 PNG</a></div></section><section class="catalog" id="catalog" aria-label="动态列表"></section><section class="parts" id="parts"><img src="parts.png" alt="独立部件与透明通道"></section></main><footer>离线制作预览 · 说话为口型示范，未连接音频 · 未安装触摸监听或修改当前插件</footer>
<script>
const clips=__MOTION_DATA__;
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');
let selected=0,atlas=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,position=0,last=0,handle=0,loading=0;
const visible=()=>!document.hidden&&$('viewer').style.display!=='none';
function paint(){if(!atlas)return;const f=Math.min(179,Math.floor(position));ctx.clearRect(0,0,336,336);ctx.drawImage(atlas,(f%12)*336,Math.floor(f/12)*336,336,336,0,0,336,336);$('timeline').value=f;$('frame').textContent=String(f+1).padStart(3,'0')+'/180'}
function loop(time){handle=0;if(!last)last=time;if(playing&&visible()){position=(position+(time-last)*.03*Number($('speed').value))%180;paint();last=time;handle=requestAnimationFrame(loop)}else last=0}
function wake(){if(!handle&&playing&&visible()){last=0;handle=requestAnimationFrame(loop)}$('play').innerHTML=playing?'&#10074;&#10074;':'&#9654;';$('play').title=playing?'暂停':'播放';$('play').setAttribute('aria-label',$('play').title)}
function select(index){selected=(index+clips.length)%clips.length;position=0;const token=++loading,clip=clips[selected];$('name').textContent=clip.Label;for(const type of ['gif','webp'])$(type).href='clips/'+clip.Id+'.'+type;$('poster').href='posters/'+clip.Id+'.png';document.querySelectorAll('.tile').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));const image=new Image;image.onload=()=>{if(token!==loading)return;atlas=image;paint();wake()};image.onerror=()=>{$('name').textContent=clip.Label+' / 图集未加载'};image.src='atlases/'+clip.Id+'.png'}
function tab(which){const parts=which==='parts';$('parts').classList.toggle('active',parts);$('viewer').style.display=parts?'none':'';$('catalog').style.display=parts?'none':'';for(const [id,key] of [['motionTab','motions'],['partsTab','parts'],['rigTab','rig']])$(id).setAttribute('aria-pressed',which===key);if(which==='rig')select(clips.length-1);wake()}
clips.forEach((clip,i)=>{const button=document.createElement('button');button.className='tile';button.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src='posters/'+clip.Id+'.png';img.alt='';img.loading='lazy';const label=document.createElement('span');label.textContent=clip.Label;const meta=document.createElement('small');meta.textContent=clip.Id;button.append(img,label,meta);button.onclick=()=>{if(i===clips.length-1)tab('rig');else{tab('motions');select(i)}};$('catalog').append(button)});
$('play').onclick=()=>{playing=!playing;wake()};$('timeline').oninput=()=>{playing=false;position=Number($('timeline').value);paint();wake()};$('previous').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);$('dark').onclick=()=>document.body.classList.remove('light');$('light').onclick=()=>document.body.classList.add('light');$('checker').onclick=()=>{$('stage').classList.toggle('checker')};$('motionTab').onclick=()=>tab('motions');$('partsTab').onclick=()=>tab('parts');$('rigTab').onclick=()=>tab('rig');document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden&&handle){cancelAnimationFrame(handle);handle=0}wake()});select(0);
</script>
</html>
